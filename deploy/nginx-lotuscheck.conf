# /etc/nginx/sites-available/lotuscheck
#
# Install as a port-80 server block first, then run:
#   sudo certbot --nginx -d lotus.javan.id --redirect
# certbot adds the port-443 block and the ssl_certificate paths itself. Do
# not hand-write `listen ... ssl` without a valid cert — nginx refuses to
# start. HTTP-01 works even though the name is proxied by Cloudflare:
# Cloudflare passes /.well-known/acme-challenge/ through to the origin.
#
# The site name is `lotuscheck`, not `lotus`: an unrelated application
# (the AlurKerja on-premise toolkit, lotus.alurkerja.com) already owns
# /etc/nginx/sites-available/lotus, the `lotus` UNIX user, /opt/lotus,
# /etc/lotus and port 8080 on this host. Everything here is namespaced to
# avoid colliding with it.

# A QA share link (/s/qa/<token>) and an invitation link (/invite/<token>)
# carry their secret in the path; Lotus stores only its hash, so the access
# log must not keep it either. The app's own log redacts the same way
# (internal/web/request_log.go).
map $request_uri $lotuscheck_log_uri {
    ~^(?<lotuscheck_secret_route>/s/qa/|/invite/)  "${lotuscheck_secret_route}[redacted]";
    default                                         $request_uri;
}
log_format lotuscheck_redacted '$remote_addr - $remote_user [$time_local] '
                               '"$request_method $lotuscheck_log_uri $server_protocol" $status $body_bytes_sent '
                               '"$http_referer" "$http_user_agent"';

upstream lotuscheck_backend {
    # App binds 127.0.0.1:8085 (ADDR in /etc/lotuscheck/lotuscheck.env).
    # 8080-8084 are all taken on this host: 8080 lotus.alurkerja.com,
    # 8081 ceo-monitor, 8082 talisa, 8083 alurkerja-dev, 8084 docker.
    server 127.0.0.1:8085;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;

    # Single mode: one origin, one organization, no subdomains. To move
    # this instance to saas mode, this becomes:
    #     server_name lotus.javan.id *.lotus.javan.id;
    # which additionally needs a wildcard DNS record and a certificate
    # valid for *.lotus.javan.id — see deploy/README.md, "Switching to
    # multi-tenant (saas) mode".
    server_name lotus.javan.id;

    # 4m for the site. The app accepts up to 25 MB (internal/web/server.go
    # BodyLimit, for QA attachments), but it reads a body whole before any
    # middleware can refuse it, so only the upload routes below get 25m.
    client_max_body_size 4m;

    access_log /var/log/nginx/lotuscheck.access.log lotuscheck_redacted;
    error_log  /var/log/nginx/lotuscheck.error.log;

    location / {
        proxy_pass http://lotuscheck_backend;
        proxy_http_version 1.1;

        # Host is preserved deliberately. Lotus resolves the organization
        # from the request host (internal/web resolver), so a rewritten
        # Host header would break tenant resolution the moment this
        # instance moves to saas mode.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_connect_timeout 30s;
        proxy_buffering off;
    }

    # QA uploads: a result with its files (20 MB each, checked by the app)
    # and the CSV case import. The only routes allowed past 4m.
    location ~ ^/projects/[^/]+/qa/(runs/[^/]+/items/[^/]+/result|cases/import(/confirm)?)$ {
        client_max_body_size 25m;
        proxy_pass http://lotuscheck_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Push-direction ingest (internal/web/ingest.go) posts a whole Trivy
    # report. It keeps the site's 4m: the app would now take 25 MB, but
    # Task 136883 asks for the ingest limit to be chosen deliberately and
    # written into the ingest docs, not inherited from QA attachments.
    location /ingest/ {
        proxy_pass http://lotuscheck_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }

    location = /healthz {
        proxy_pass http://lotuscheck_backend/healthz;
        access_log off;
    }
}
