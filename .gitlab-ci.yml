stages:
  - test
  - e2e
  - build
  - deploy

# Every job is tagged `product`. Not decoration: every runner registered
# on this GitLab has run_untagged=false, so an untagged job matches
# nothing and sits in `pending` until someone cancels it — which is
# exactly what happened to this project's first four pipelines. `product`
# is the runner on the deploy host itself, and is what talisa's jobs use.
variables:
  GIT_DEPTH: "20"
  GOPATH: "$CI_PROJECT_DIR/.go"
  GOMODCACHE: "$CI_PROJECT_DIR/.go/pkg/mod"

# ---------------------------------------------------------------------------
# Test — full suite against a real Postgres service, plus the two static
# guardrails (go vet, and the task-0.4 CI check that no db.Get/Select/Exec/
# Query call exists outside internal/repo). Each Go test creates and
# migrates its own Postgres schema on TEST_DATABASE_URL (see
# internal/dbtest), so this job needs nothing more than a reachable
# Postgres — no separate migrate step. Runs on every push, not just main,
# so a broken branch fails before it reaches build.
# ---------------------------------------------------------------------------
test:
  stage: test
  tags:
    - product
  image: golang:1.26-bookworm
  services:
    - name: postgres:17-alpine
      alias: postgres
      # One schema per test, and migration 00018 builds 60 partitions plus
      # their policies in a single transaction. `go test ./...` runs
      # packages in parallel, so the concurrent schema builds exhaust the
      # default 64-entry lock table and Postgres answers "out of shared
      # memory (SQLSTATE 53200)" — random-looking failures in whichever
      # package lost the race, with nothing wrong in the code.
      command: ["postgres", "-c", "max_locks_per_transaction=512"]
  variables:
    POSTGRES_USER: lotus
    POSTGRES_PASSWORD: lotus
    POSTGRES_DB: lotus_test
    TEST_DATABASE_URL: "postgres://lotus:lotus@postgres:5432/lotus_test?sslmode=disable"
  before_script:
    - for i in $(seq 1 30); do (echo > /dev/tcp/postgres/5432) >/dev/null 2>&1 && break; sleep 1; done
  script:
    - go vet ./...
    - ./scripts/check-repo-scope.sh
    - go test ./...
  only:
    variables:
      - $CI_COMMIT_MESSAGE !~ /\[skip ci\]/
  cache:
    key: lotus-${CI_COMMIT_REF_SLUG}
    paths:
      - .go/pkg/mod/

# ---------------------------------------------------------------------------
# E2E — Playwright drives a real build of the app against a real Postgres.
# Same webServer command as local (`make css` + `go run ./cmd/lotus serve`),
# so this exercises the exact dev-mode boot path contributors use.
# ---------------------------------------------------------------------------
e2e:
  stage: e2e
  tags:
    - product
  image: golang:1.26-bookworm
  services:
    - name: postgres:17-alpine
      alias: postgres
  variables:
    POSTGRES_USER: lotus
    POSTGRES_PASSWORD: lotus
    POSTGRES_DB: lotus
    DATABASE_URL: "postgres://lotus:lotus@postgres:5432/lotus?sslmode=disable"
    MIGRATE_DATABASE_URL: "postgres://lotus:lotus@postgres:5432/lotus?sslmode=disable"
  before_script:
    - for i in $(seq 1 30); do (echo > /dev/tcp/postgres/5432) >/dev/null 2>&1 && break; sleep 1; done
    - apt-get update -qq && apt-get install -y --no-install-recommends curl ca-certificates nodejs npm
    - go run ./cmd/lotus migrate up
  script:
    - cd e2e
    - npm install
    - npx playwright install --with-deps chromium
    - npx playwright test
  artifacts:
    when: always
    paths:
      - e2e/playwright-report/
      - e2e/test-results/
    expire_in: 7 days
  only:
    variables:
      - $CI_COMMIT_MESSAGE !~ /\[skip ci\]/
  cache:
    key: lotus-${CI_COMMIT_REF_SLUG}
    paths:
      - .go/pkg/mod/

# ---------------------------------------------------------------------------
# Build — produces the self-contained Linux binary as an artifact. Lotus
# embeds its templates + static assets, uses the standalone Tailwind CLI (no
# Node), and pure-Go pgx for Postgres (CGO_ENABLED=0), so the build is a
# single static binary with no runtime dependencies.
# ---------------------------------------------------------------------------
build:
  stage: build
  tags:
    - product
  image: golang:1.26-bookworm
  before_script:
    - apt-get update -qq && apt-get install -y --no-install-recommends curl ca-certificates
    - curl -fsSL -o /usr/local/bin/tailwindcss https://github.com/tailwindlabs/tailwindcss/releases/latest/download/tailwindcss-linux-x64
    - chmod +x /usr/local/bin/tailwindcss
  script:
    - tailwindcss -i web/static/css/app.css -o web/static/css/app.built.css --minify
    - mkdir -p bin
    - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o bin/lotus ./cmd/lotus
    - ls -la bin/lotus
    - sha256sum bin/lotus > bin/lotus.sha256
  artifacts:
    name: "lotus-${CI_COMMIT_SHORT_SHA}"
    paths:
      - bin/lotus
      - bin/lotus.sha256
    expire_in: 30 days
  only:
    refs:
      - main
    variables:
      - $CI_COMMIT_MESSAGE !~ /\[skip ci\]/
  cache:
    key: lotus-${CI_COMMIT_REF_SLUG}
    paths:
      - .go/pkg/mod/

# ---------------------------------------------------------------------------
# Deploy — ships the built binary and renders the runtime config from GitLab
# CI/CD variables. The server holds no hand-edited env file and no git
# checkout: /etc/lotuscheck/lotuscheck.env is rewritten from these variables
# on every deploy, so GitLab is the single source of truth for production
# config. update.sh (shipped alongside) runs the migrations, swaps the
# binary atomically and health-checks /healthz, rolling back on failure.
#
# One-time provisioning is deploy/bootstrap.sh — see deploy/README.md.
#
# Required CI/CD variables (all already set on this project):
#   SSH_PRIVATE_KEY  PROD_SERVER_HOST  PROD_SERVER_USER
#   DATABASE_URL     MIGRATE_DATABASE_URL
#   SESSION_SECRET   LOTUS_KEK        (masked)
#   LOTUS_MODE       LOTUS_URL        APP_DOMAIN
# Optional: APP_ADDR, LOTUS_BASE_DOMAIN, LOTUS_WORKER_COUNT, GITHUB_*,
#   GOOGLE_*, SMTP_*.
#
# Manual (`when: manual`) rather than automatic on main. Lotus is a
# single-tenant install today holding one organization's live metrics; a
# green pipeline is not on its own a reason to restart it under whoever
# happens to be looking at the dashboard.
# ---------------------------------------------------------------------------
deploy_prod:
  stage: deploy
  tags:
    - product
  image: javanlabs/ssh-client:latest
  needs:
    - job: build
      artifacts: true
  only:
    refs:
      - main
    variables:
      - $CI_COMMIT_MESSAGE !~ /\[skip ci\]/
  when: manual
  before_script:
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H $PROD_SERVER_HOST >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - echo "📝 Rendering runtime env from GitLab CI/CD variables..."
    # umask before the heredoc, not after: the file carries the KEK and the
    # database password, and it exists on the runner's disk until the rm
    # below.
    - |
      umask 077
      cat > lotuscheck.env <<EOF
      ADDR=${APP_ADDR:-127.0.0.1:8085}
      LOTUS_DEV=0
      COOKIE_SECURE=1
      LOTUS_MODE=${LOTUS_MODE:-single}
      LOTUS_URL=${LOTUS_URL:-https://${APP_DOMAIN}}
      LOTUS_BASE_DOMAIN=${LOTUS_BASE_DOMAIN:-${APP_DOMAIN}}
      DATABASE_URL=${DATABASE_URL}
      MIGRATE_DATABASE_URL=${MIGRATE_DATABASE_URL}
      SESSION_SECRET=${SESSION_SECRET}
      LOTUS_KEK=${LOTUS_KEK}
      LOTUS_WORKER_COUNT=${LOTUS_WORKER_COUNT:-4}
      GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      SMTP_HOST=${SMTP_HOST}
      SMTP_PORT=${SMTP_PORT:-587}
      SMTP_USER=${SMTP_USER}
      SMTP_PASSWORD=${SMTP_PASSWORD}
      SMTP_FROM=${SMTP_FROM:-Lotus <no-reply@javan.co.id>}
      EOF
    - echo "🚚 Uploading binary, env, and update.sh..."
    - scp bin/lotus $PROD_SERVER_USER@$PROD_SERVER_HOST:/tmp/lotus.new
    - scp bin/lotus.sha256 $PROD_SERVER_USER@$PROD_SERVER_HOST:/tmp/lotus.new.sha256
    - scp lotuscheck.env $PROD_SERVER_USER@$PROD_SERVER_HOST:/tmp/lotuscheck.env
    - scp deploy/update.sh $PROD_SERVER_USER@$PROD_SERVER_HOST:/tmp/update.sh
    - rm -f lotuscheck.env
    - echo "🚀 Installing env + running update.sh on server..."
    - |
      ssh $PROD_SERVER_USER@$PROD_SERVER_HOST << 'ENDSSH'
        set -e
        sudo install -d -m 0750 -o root -g lotuscheck /etc/lotuscheck
        sudo install -o root -g lotuscheck -m 0640 /tmp/lotuscheck.env /etc/lotuscheck/lotuscheck.env
        rm -f /tmp/lotuscheck.env
        sudo bash /tmp/update.sh /tmp/lotus.new
        rm -f /tmp/update.sh
      ENDSSH
    - echo "🎉 Deployment OK."
  environment:
    name: production
    url: https://lotus.javan.id
