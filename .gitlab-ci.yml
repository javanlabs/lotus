stages:
  - test
  - e2e
  - build
  - deploy

# Every job is tagged `product`. Not decoration: every runner registered
# on this GitLab has run_untagged=false, so an untagged job matches
# nothing and sits in `pending` until someone cancels it — which is
# exactly what happened to this project's first four pipelines. `product`
# is the runner on the deploy host itself, and is what talisa's jobs use.
variables:
  GIT_DEPTH: "20"
  GOPATH: "$CI_PROJECT_DIR/.go"
  GOMODCACHE: "$CI_PROJECT_DIR/.go/pkg/mod"
  # The compiled-package cache. Without it every job compiled the whole
  # tree from nothing — about a minute and a half of each test and build
  # job, and twice over in e2e.
  GOCACHE: "$CI_PROJECT_DIR/.go/cache"
  GO_VERSION: "1.26.2"
  POSTGRES_IMAGE: "postgres:17-alpine"

# test, e2e and build share nothing but the commit, so all three start at
# once (`needs: []`); deploy waits for all of them. The stages only order
# the graph's display.
#
# Each job keeps its own cache: test binaries, the linux release build and
# e2e's toolchain compile different things, and three parallel jobs
# writing one key would overwrite each other. A branch's first pipeline
# starts from main's.
.go_cache: &go_cache
  paths:
    - .go/pkg/mod/
    - .go/cache/

# ---------------------------------------------------------------------------
# Test — full suite against a real Postgres service, plus the two static
# guardrails (go vet, and the task-0.4 CI check that no db.Get/Select/Exec/
# Query call exists outside internal/repo). Each Go test creates and
# migrates its own Postgres schema on TEST_DATABASE_URL (see
# internal/dbtest), so this job needs nothing more than a reachable
# Postgres — no separate migrate step. Runs on every push, not just main,
# so a broken branch fails before it reaches build.
# ---------------------------------------------------------------------------
test:
  stage: test
  needs: []
  # A newer push to the same ref makes this run moot; GitLab may cancel it.
  interruptible: true
  tags:
    - product
  image: golang:1.26-bookworm
  services:
    - name: $POSTGRES_IMAGE
      alias: postgres
      # One schema per test, and migration 00018 builds 60 partitions plus
      # their policies in a single transaction. `go test ./...` runs
      # packages in parallel, so the concurrent schema builds exhaust the
      # default 64-entry lock table and Postgres answers "out of shared
      # memory (SQLSTATE 53200)" — random-looking failures in whichever
      # package lost the race, with nothing wrong in the code. fsync and
      # synchronous_commit off: a test database is thrown away with the
      # job, and every one of those schema builds otherwise waits on disk.
      command: ["postgres", "-c", "max_locks_per_transaction=512", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
  variables:
    POSTGRES_USER: lotus
    POSTGRES_PASSWORD: lotus
    POSTGRES_DB: lotus_test
    TEST_DATABASE_URL: "postgres://lotus:lotus@postgres:5432/lotus_test?sslmode=disable"
  before_script:
    - for i in $(seq 1 30); do (echo > /dev/tcp/postgres/5432) >/dev/null 2>&1 && break; sleep 1; done
  script:
    - go vet ./...
    - ./scripts/check-repo-scope.sh
    - go test ./...
  only:
    variables:
      - $CI_COMMIT_MESSAGE !~ /\[skip ci\]/
  cache:
    <<: *go_cache
    key: lotus-test-${CI_COMMIT_REF_SLUG}
    fallback_keys:
      - lotus-test-main

# ---------------------------------------------------------------------------
# E2E — Playwright drives a real build of the app against a real Postgres.
#
# Runs in Playwright's own image, pinned to the version e2e/package-lock.json
# installs: Node, Chromium and every library it needs are already there,
# where the golang image spent a minute and a half on apt, NodeSource and
# `playwright install --with-deps` on every run. Go comes in as a tarball,
# kept in the cache with Tailwind. The app is built once and that binary
# both migrates and serves (LOTUS_E2E_BIN, e2e/playwright.config.ts), where
# `go run` used to compile it twice. Bump the image tag with the lockfile.
# ---------------------------------------------------------------------------
e2e:
  stage: e2e
  needs: []
  # A newer push to the same ref makes this run moot; GitLab may cancel it.
  interruptible: true
  tags:
    - product
  image: mcr.microsoft.com/playwright:v1.62.1-noble
  services:
    - name: $POSTGRES_IMAGE
      alias: postgres
      command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
  variables:
    POSTGRES_USER: lotus
    POSTGRES_PASSWORD: lotus
    POSTGRES_DB: lotus
    # These two are documentation only — a project CI/CD variable of the
    # same name beats them. before_script exports the values that actually
    # take effect.
    DATABASE_URL: "postgres://lotus:lotus@postgres:5432/lotus?sslmode=disable"
    MIGRATE_DATABASE_URL: "postgres://lotus:lotus@postgres:5432/lotus?sslmode=disable"
    LOTUS_E2E_BIN: "./bin/lotus"
    # npm ci empties node_modules every run; its download cache is what
    # is worth keeping.
    npm_config_cache: "$CI_PROJECT_DIR/.npm"
  before_script:
    # Neutralize the deploy-only project variables before anything reads
    # them. Project CI/CD variables OUTRANK a job's own `variables:` block,
    # so the production DATABASE_URL set for deploy_prod silently replaced
    # the one declared above and this job tried to migrate
    # user=lotuscheck_migrate database=lotuscheck. It only failed safe
    # because 127.0.0.1 inside a job container is the container itself.
    #
    # The same applies to everything Playwright's webServer inherits:
    # LOTUS_MODE=single would put the app under test in single-org mode,
    # where the tenant-subdomain specs cannot pass, and there is no reason
    # for a test process to hold the production KEK or session secret.
    - |
      unset LOTUS_MODE LOTUS_URL LOTUS_KEK SESSION_SECRET \
            OIDC_ISSUER OIDC_CLIENT_ID OIDC_CLIENT_SECRET OIDC_TRUST_EMAIL \
            KEYCLOAK_URL KEYCLOAK_REALM KEYCLOAK_CLIENT KEYCLOAK_CLIENT_SECRET
      export DATABASE_URL="postgres://lotus:lotus@postgres:5432/lotus?sslmode=disable"
      export MIGRATE_DATABASE_URL="$DATABASE_URL"
      export LOTUS_BASE_DOMAIN="lotus.localhost"
    # Go and Tailwind, from the cache when they are there.
    - command -v curl >/dev/null || (apt-get update -qq && apt-get install -y --no-install-recommends curl ca-certificates)
    - |
      if [ ! -x .go/sdk/go/bin/go ]; then
        mkdir -p .go/sdk
        curl -fsSL "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz" | tar -C .go/sdk -xz
      fi
      export PATH="$CI_PROJECT_DIR/.go/sdk/go/bin:$PATH"
      go version
    - |
      if [ ! -x .go/tailwindcss ]; then
        curl -fsSL -o .go/tailwindcss https://github.com/tailwindlabs/tailwindcss/releases/latest/download/tailwindcss-linux-x64
        chmod +x .go/tailwindcss
      fi
    - .go/tailwindcss -i web/static/css/app.css -o web/static/css/app.built.css --minify
    - CGO_ENABLED=0 go build -o bin/lotus ./cmd/lotus
    - for i in $(seq 1 30); do (echo > /dev/tcp/postgres/5432) >/dev/null 2>&1 && break; sleep 1; done
    - ./bin/lotus migrate up
  script:
    - cd e2e
    - npm ci
    - npx playwright test
  artifacts:
    when: always
    paths:
      - e2e/playwright-report/
      - e2e/test-results/
    expire_in: 7 days
  only:
    variables:
      - $CI_COMMIT_MESSAGE !~ /\[skip ci\]/
  cache:
    key: lotus-e2e-${CI_COMMIT_REF_SLUG}
    fallback_keys:
      - lotus-e2e-main
    paths:
      - .go/pkg/mod/
      - .go/cache/
      - .go/sdk/
      - .go/tailwindcss
      - .npm/

# ---------------------------------------------------------------------------
# Build — produces the self-contained Linux binary as an artifact. Lotus
# embeds its templates + static assets, uses the standalone Tailwind CLI (no
# Node), and pure-Go pgx for Postgres (CGO_ENABLED=0), so the build is a
# single static binary with no runtime dependencies. It does not wait for
# the tests: deploy does.
# ---------------------------------------------------------------------------
build:
  stage: build
  needs: []
  # A newer push to the same ref makes this run moot; GitLab may cancel it.
  interruptible: true
  tags:
    - product
  image: golang:1.26-bookworm
  script:
    - |
      if [ ! -x .go/tailwindcss ]; then
        mkdir -p .go
        curl -fsSL -o .go/tailwindcss https://github.com/tailwindlabs/tailwindcss/releases/latest/download/tailwindcss-linux-x64
        chmod +x .go/tailwindcss
      fi
    - .go/tailwindcss -i web/static/css/app.css -o web/static/css/app.built.css --minify
    - mkdir -p bin
    - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o bin/lotus ./cmd/lotus
    - ls -la bin/lotus
    - sha256sum bin/lotus > bin/lotus.sha256
  artifacts:
    name: "lotus-${CI_COMMIT_SHORT_SHA}"
    paths:
      - bin/lotus
      - bin/lotus.sha256
    expire_in: 30 days
  only:
    refs:
      - main
    variables:
      - $CI_COMMIT_MESSAGE !~ /\[skip ci\]/
  cache:
    key: lotus-build-${CI_COMMIT_REF_SLUG}
    fallback_keys:
      - lotus-build-main
    paths:
      - .go/pkg/mod/
      - .go/cache/
      - .go/tailwindcss

# ---------------------------------------------------------------------------
# Deploy — ships the built binary and renders the runtime config from GitLab
# CI/CD variables. The server holds no hand-edited env file and no git
# checkout: /etc/lotuscheck/lotuscheck.env is rewritten from these variables
# on every deploy, so GitLab is the single source of truth for production
# config. update.sh (shipped alongside) runs the migrations, swaps the
# binary atomically and health-checks /healthz, rolling back on failure.
#
# One-time provisioning is deploy/bootstrap.sh — see deploy/README.md.
#
# Required CI/CD variables (all already set on this project):
#   SSH_PRIVATE_KEY  PROD_SERVER_HOST  PROD_SERVER_USER
#   DATABASE_URL     MIGRATE_DATABASE_URL
#   SESSION_SECRET   LOTUS_KEK        (masked)
#   LOTUS_MODE       LOTUS_URL        APP_DOMAIN
# Optional: APP_ADDR, LOTUS_BASE_DOMAIN, LOTUS_WORKER_COUNT, LOTUS_FEATURE_QA, GITHUB_*,
#   GOOGLE_*, SMTP_*.
#
# Automatic on main (2026-10-18): every push to main that passes test and
# e2e and builds goes to production; deploy needs all three. update.sh's
# health check and rollback are what keep a bad binary from staying up.
# To hold a push back, put [skip ci] in its commit message.
# ---------------------------------------------------------------------------
deploy_prod:
  stage: deploy
  # One deploy at a time: two pushes close together queue their deploys
  # rather than swap the binary under each other.
  resource_group: production
  tags:
    - product
  image: javanlabs/ssh-client:latest
  # Deploys only what passed: the build's binary, once test and e2e are
  # green — they no longer gate build itself.
  needs:
    - job: build
      artifacts: true
    - job: test
      artifacts: false
    - job: e2e
      artifacts: false
  only:
    refs:
      - main
    variables:
      - $CI_COMMIT_MESSAGE !~ /\[skip ci\]/
  when: on_success
  before_script:
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H $PROD_SERVER_HOST >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - echo "📝 Rendering runtime env from GitLab CI/CD variables..."
    # The OIDC_* names are what the app reads; the KEYCLOAK_* fallbacks are
    # a CI-side alias for the variables this project already had, so the
    # generic provider does not end up with a vendor baked into it.
    # KEYCLOAK_CLIENT_SECRET is a protected variable, which is fine because
    # main is a protected branch — on an unprotected ref it would render
    # empty and startup would fail on the missing issuer instead.
    # umask before the heredoc, not after: the file carries the KEK and the
    # database password, and it exists on the runner's disk until the rm
    # below.
    - |
      umask 077
      cat > lotuscheck.env <<EOF
      ADDR=${APP_ADDR:-127.0.0.1:8085}
      LOTUS_DEV=0
      COOKIE_SECURE=1
      LOTUS_MODE=${LOTUS_MODE:-single}
      LOTUS_URL=${LOTUS_URL:-https://${APP_DOMAIN}}
      LOTUS_BASE_DOMAIN=${LOTUS_BASE_DOMAIN:-${APP_DOMAIN}}
      DATABASE_URL=${DATABASE_URL}
      MIGRATE_DATABASE_URL=${MIGRATE_DATABASE_URL}
      SESSION_SECRET=${SESSION_SECRET}
      LOTUS_KEK=${LOTUS_KEK}
      LOTUS_WORKER_COUNT=${LOTUS_WORKER_COUNT:-4}
      LOTUS_FEATURE_QA=${LOTUS_FEATURE_QA:-0}
      GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      OIDC_ISSUER=${OIDC_ISSUER:-${KEYCLOAK_URL}/realms/${KEYCLOAK_REALM}}
      OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-${KEYCLOAK_CLIENT}}
      OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-${KEYCLOAK_CLIENT_SECRET}}
      OIDC_TRUST_EMAIL=${OIDC_TRUST_EMAIL:-0}
      SMTP_HOST=${SMTP_HOST}
      SMTP_PORT=${SMTP_PORT:-587}
      SMTP_USER=${SMTP_USER}
      SMTP_PASSWORD=${SMTP_PASSWORD}
      SMTP_FROM=${SMTP_FROM:-Lotus <no-reply@javan.co.id>}
      EOF
    - echo "🚚 Uploading binary, env, and update.sh..."
    - scp bin/lotus $PROD_SERVER_USER@$PROD_SERVER_HOST:/tmp/lotus.new
    - scp bin/lotus.sha256 $PROD_SERVER_USER@$PROD_SERVER_HOST:/tmp/lotus.new.sha256
    - scp lotuscheck.env $PROD_SERVER_USER@$PROD_SERVER_HOST:/tmp/lotuscheck.env
    - scp deploy/update.sh $PROD_SERVER_USER@$PROD_SERVER_HOST:/tmp/update.sh
    - rm -f lotuscheck.env
    - echo "🚀 Installing env + running update.sh on server..."
    - |
      ssh $PROD_SERVER_USER@$PROD_SERVER_HOST << 'ENDSSH'
        set -e
        sudo install -d -m 0750 -o root -g lotuscheck /etc/lotuscheck
        sudo install -o root -g lotuscheck -m 0640 /tmp/lotuscheck.env /etc/lotuscheck/lotuscheck.env
        rm -f /tmp/lotuscheck.env
        sudo bash /tmp/update.sh /tmp/lotus.new
        rm -f /tmp/update.sh
      ENDSSH
    - echo "🎉 Deployment OK."
  environment:
    name: production
    url: https://lotus.javan.id
