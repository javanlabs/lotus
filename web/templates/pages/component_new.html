{{define "content"}}
{{template "shell_open" .}}

<header style="margin-bottom:18px">
  <h1 style="margin:0;font-size:23px;font-weight:700;letter-spacing:-.02em;color:#43284E">Add component</h1>
  <p style="margin:4px 0 0;font-size:12.5px;color:#6B7280">to {{.Data.ProjectName}}</p>
</header>

<section class="lotus-card lotus-shape" style="max-width:520px;padding:20px 22px;display:flex;flex-direction:column;gap:16px">
  {{if .Data.Error}}
  <div style="padding:10px 12px;border-radius:8px 3px 8px 3px;background:#F6E0E5;color:#9E2B47;font-size:12.5px">{{.Data.Error}}</div>
  {{end}}
  <form method="post" action="/projects/{{.Data.ProjectID}}/components/new" style="display:flex;flex-direction:column;gap:14px">
    <label style="display:flex;flex-direction:column;gap:6px">
      <span style="font:600 10.5px 'IBM Plex Mono',monospace;letter-spacing:.08em;color:#5B4A63">COMPONENT NAME</span>
      <input type="text" name="name" value="{{.Data.Name}}" required placeholder="billing-api"
             style="width:100%;box-sizing:border-box;padding:9px 11px;font:400 12.5px system-ui;color:#111827;background:#FFFFFF;border:1px solid rgba(67,40,78,.16);border-radius:8px;outline:none">
    </label>
    <label style="display:flex;flex-direction:column;gap:6px">
      <span style="font:600 10.5px 'IBM Plex Mono',monospace;letter-spacing:.08em;color:#5B4A63">SLUG</span>
      <input type="text" name="slug" value="{{.Data.Slug}}" required placeholder="billing-api"
             style="width:100%;box-sizing:border-box;padding:9px 11px;font:400 12px 'IBM Plex Mono',monospace;color:#111827;background:#FFFFFF;border:1px solid rgba(67,40,78,.16);border-radius:8px;outline:none">
    </label>
    <label style="display:flex;flex-direction:column;gap:6px">
      <span style="font:600 10.5px 'IBM Plex Mono',monospace;letter-spacing:.08em;color:#5B4A63">KIND</span>
      <select name="kind" required
              style="width:100%;box-sizing:border-box;padding:9px 11px;font:400 12.5px system-ui;color:#111827;background:#FFFFFF;border:1px solid rgba(67,40,78,.16);border-radius:8px;outline:none">
        {{range .Data.Kinds}}<option value="{{.}}" {{if eq . $.Data.Kind}}selected{{end}}>{{.}}</option>{{end}}
      </select>
    </label>
    <label style="display:flex;flex-direction:column;gap:6px">
      <span style="font:600 10.5px 'IBM Plex Mono',monospace;letter-spacing:.08em;color:#5B4A63">LANGUAGE (OPTIONAL)</span>
      <input type="text" name="language" value="{{.Data.Language}}" placeholder="Go"
             style="width:100%;box-sizing:border-box;padding:9px 11px;font:400 12.5px system-ui;color:#111827;background:#FFFFFF;border:1px solid rgba(67,40,78,.16);border-radius:8px;outline:none">
    </label>

    <div style="display:flex;justify-content:flex-end;gap:8px;padding-top:6px">
      <a href="/projects/{{.Data.ProjectID}}" class="btn-lotus btn-lotus-secondary">Cancel</a>
      <button type="submit" class="btn-lotus btn-lotus-primary" style="border:none">Add component</button>
    </div>
  </form>
</section>

{{template "shell_close" .}}
{{end}}
