{{/* invite_resent: the new link after Resend, shown once in the invitation's
     row. The old link no longer works. */}}
{{define "invite_resent"}}
<div style="display:flex;flex-direction:column;gap:6px;padding:10px 14px 12px;border-bottom:1px solid #F3F4F6">
  <span style="font-size:12px;color:#374151">New link for <strong>{{.Email}}</strong>. The earlier link no longer works; it is emailed when mail is set up, otherwise send this one.</span>
  <input type="text" readonly value="{{.Link}}" aria-label="New invitation link" class="lotus-input lotus-input-mono" onclick="this.select()">
</div>
{{end}}
