{{define "layout"}}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{if .Title}}{{.Title}} · Lotus{{else}}Lotus{{end}}</title>
  <link rel="stylesheet" href="/static/css/app.built.css">
  <script src="/static/vendor/htmx.min.js" defer></script>
  <!-- Before Alpine: it registers the component functions Alpine's
       x-data expressions resolve at init. -->
  <script src="/static/js/lotus.js"></script>
  <script src="/static/vendor/alpine.min.js" defer></script>
  <!-- Basecoat supplies the combobox and the toast. Its runtime must load
       before the components it initializes; it then keeps watching the DOM
       with a MutationObserver, so htmx swaps are picked up on their own. -->
  <script src="/static/vendor/basecoat.min.js" defer></script>
  <script src="/static/vendor/basecoat-popover.min.js" defer></script>
  <script src="/static/vendor/basecoat-combobox.min.js" defer></script>
  <script src="/static/vendor/basecoat-toast.min.js" defer></script>
  <!-- Sparklines. Must stay a classic script, not a module: lotus.js calls
       its top-level `initSparkline` as a bare global for htmx-swapped
       charts, which module scoping would hide. -->
  <script src="/static/vendor/sparklines.js" defer></script>
</head>
<body class="min-h-screen bg-surface text-ink antialiased">
  {{block "content" .}}{{end}}
</body>
</html>
{{end}}
